<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spell Dash</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#000;color:#fff;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body,#gameContainer,canvas{overscroll-behavior:none;touch-action:none}
  #gameContainer{position:relative;width:100%;max-width:512px;height:75vh;background:#222;overflow:hidden}
  canvas{width:100%;height:100%;background:#1b1b1b;display:block}
  #ui{display:flex;gap:10px;justify-content:space-between;width:100%;max-width:512px;margin:8px 0 10px;align-items:flex-start}
  #wordList{background:#0e0e0e;padding:6px 8px;font-size:14px;max-height:20vh;overflow:auto;flex:1;border:1px solid #333}
  #controls{display:flex;flex-direction:column;gap:6px;width:44%}
  #controls textarea{width:100%}
  #banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#151515;color:#fff;padding:18px 22px;border:2px solid #fff;display:none;z-index:5;text-align:center}
  select,button,label{background:#111;color:#fff;border:1px solid #333;padding:8px}
  .hidden{display:none !important}
  @supports(padding:max(0px)){body{padding-bottom:env(safe-area-inset-bottom)}}
  @media (max-width:600px),(orientation:portrait){#gameContainer{height:82vh}#ui{gap:10px;flex-direction:column}#controls{width:100%}#wordList{max-height:26vh}}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="banner">
    <div id="finalTitle">Finished!</div>
    <div id="finalStats"></div>
    <div id="finalHigh"></div>
  </div>
</div>
<div id="ui">
  <div id="controls">
    <textarea id="wordsInput" rows="6" cols="16" placeholder="Paste or type words here, one per line"></textarea>
    <select id="heroSel">
      <option value="bolt">Bolt (blue)</option>
      <option value="skye">Skye (fox, orange)</option>
      <option value="brick">Brick (red)</option>
      <option value="shade">Shade (black)</option>
    </select>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <label><input type="checkbox" id="muteSfx"> Mute Sounds</label>
      <label><input type="checkbox" id="muteMusic"> Mute Music</label>
    </div>
    <button id="startBtn">Start</button>
  </div>
  <div id="wordList"></div>
</div>
<audio id="bgm" preload="auto" loop src="bit-shift-kevin-macleod-main-version-24901-03-12.mp3"></audio>
<script>
let canvas=document.getElementById('gameCanvas');
let ctx=canvas.getContext('2d');
function fit(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}
function layout(){let h=canvas.height;baseY=h*0.85;choiceY=h*0.78;spawnY=h*0.22}
window.addEventListener('resize',()=>{fit();layout()});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{fit();layout()},150)});
fit();
let lanes=2;let playerLane=0;function laneXAtY(y,lane){let h=canvas.height;let w=canvas.width;let t=Math.max(0,Math.min(1,(y-h*0.15)/(h*0.85)));let center=w*0.5;let offTop = lane===0? -w*0.08 : w*0.08;let offBot = lane===0? -w*0.35 : w*0.35;let off = offTop + (offBot-offTop)*t;return center+off}
let baseY;let choiceY;let spawnY;layout();
let pool=[];let original=[];let active=[];let obstacles=[];let tick=0;let playing=false;let boss=false;let bossClears=0;let bossGoal=0;let bossSpeed=2.6;let rafId=null;
let rings=0;let highscores=[];let maxRings=0;let nextPairIn=0;
let heroSkin='bolt';
let shake=0,flash=0,jump=0,hurt=0;let particles=[];let ringFX=[];
function speak(t){try{if(document.getElementById('muteSfx').checked)return;let u=new SpeechSynthesisUtterance(t);u.rate=0.95;u.pitch=1;u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function jumble(w){if(w.length<4) return null;let mid=w.slice(1,-1).split('');for(let i=0;i<24;i++){let s=mid.slice().sort(()=>Math.random()-0.5).join('');if(s!==mid.join(''))return w[0]+s+w[w.length-1]}return null}
function refreshList(){document.getElementById('wordList').innerHTML=original.map(w=>'<div>'+w+'</div>').join('')}
let bossQueue=[];
function spawnPair(fromBoss){let src=fromBoss?bossQueue:pool;if(src.length===0)return;let w=src.shift();let j=jumble(w);if(!j){src.push(w);return spawnPair(fromBoss)}let leftFirst=Math.random()<0.5;let left=leftFirst?w:j;let right=leftFirst?j:w;active.push({y:spawnY,speed:(boss?bossSpeed:1.5),left,right,correctLane:(right===w?1:0),word:w,resolved:false});speak(w)}
function canPlaceObstacle(lane,y){for(const a of active){if(Math.abs(a.y-y)<220) return false}for(const o of obstacles){if(o.lane===lane && Math.abs(o.y-y)<160) return false}return true}
function spawnObstacle(){let lane=Math.random()<0.5?0:1;let y=spawnY;if(!canPlaceObstacle(lane,y)) return;obstacles.push({lane,y,speed:1.2,kind:Math.random()<0.5?'barrier':'pit'})}
function startBoss(){boss=true;bossClears=0;bossQueue=original.slice();bossGoal=original.length;document.getElementById('finalTitle').textContent=''}
function startGame(){let raw=document.getElementById('wordsInput').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(raw.length===0){alert('Please paste words to play.');return}original=[...new Set(raw.map(s=>s.toLowerCase()))];pool=original.slice();active=[];obstacles=[];rings=0;tick=0;playing=true;boss=false;bossClears=0;maxRings=original.length*2;nextPairIn=10;refreshList();document.getElementById('banner').style.display='none';document.getElementById('finalTitle').textContent='Finished!';if(rafId)cancelAnimationFrame(rafId);document.getElementById('wordList').classList.add('hidden');let bgm=document.getElementById('bgm');if(bgm&&!document.getElementById('muteMusic').checked){try{bgm.currentTime=0;bgm.play()}catch(e){}}update()}
function ringChange(d){rings=Math.max(0,Math.min(maxRings,rings+d))}
function resolve(o,correct){let hx=laneXAtY(baseY,playerLane);if(correct){ringChange(1);jump=12;emitParticles(hx,baseY-30,'#ffd85a',16);emitRingFX(hx,baseY-40,4);if(boss)bossClears++;}else{ringChange(-1);shake=10;flash=10;hurt=18;emitParticles(hx,baseY-30,'#ff6565',14);emitRingFX(hx,baseY-40,8);if(boss){bossQueue.push(o.word)}else{pool.push(o.word)}}o.resolved=true;nextPairIn=28}
function update(){if(!playing)return;tick++;ctx.clearRect(0,0,canvas.width,canvas.height);drawRoad();if(!boss&&tick%260===0)spawnObstacle();if(active.length===0&&nextPairIn<=0){spawnPair(boss)}if(nextPairIn>0)nextPairIn--;for(const a of active){a.y+=a.speed}for(const ob of obstacles){let near=active.some(a=>Math.abs(a.y-ob.y)<140);if(!near)ob.y+=ob.speed}for(const ob of obstacles){drawObstacle(ob)}for(const a of active){drawPair(a)}active=active.filter(a=>a.y<canvas.height+40 && !a.resolved);let keepObs=[];for(const o of obstacles){if(o.y>=baseY-20 && o.lane===playerLane){ringChange(-1);shake=10;flash=10;hurt=18;let hx=laneXAtY(baseY,playerLane);emitParticles(hx,baseY-30,'#ff6565',12);emitRingFX(hx,baseY-40,6);} if(o.y<canvas.height+40) keepObs.push(o);}obstacles=keepObs;if(active[0]&&!active[0].resolved&&active[0].y>=choiceY){let a=active[0];let chosen=(playerLane===a.correctLane);resolve(a,chosen)}drawPlayer();drawHUD();checkEnd();drawParticles();rafId=requestAnimationFrame(update);if(shake>0)shake--;if(flash>0)flash--;if(jump>0)jump--;if(hurt>0)hurt--}if(nextPairIn>0)nextPairIn--;for(const a of active){a.y+=a.speed;drawPair(a)}for(const ob of obstacles){ob.y+=ob.speed;drawObstacle(ob)}active=active.filter(a=>a.y<canvas.height+40 && !a.resolved);obstacles=obstacles.filter(o=>o.y<canvas.height+40);if(active[0]&&!active[0].resolved&&active[0].y>=choiceY){let a=active[0];let chosen=(playerLane===a.correctLane);resolve(a,chosen)}drawPlayer();drawHUD();checkEnd();drawParticles();rafId=requestAnimationFrame(update);if(shake>0)shake--;if(flash>0)flash--;if(jump>0)jump--;if(hurt>0)hurt--}
function drawRoad(){let w=canvas.width;let h=canvas.height;ctx.save();if(shake>0){ctx.translate((Math.random()*6-3),(Math.random()*6-3))}if(boss){ctx.fillStyle='#13001e';ctx.fillRect(0,0,w,h);for(let i=0;i<40;i++){let sx=((i*97+tick*0.7)%w);let sy=((i*53+tick*0.9)%h*0.4)|0;ctx.fillStyle='#4a2a6a';ctx.fillRect(sx,sy,2,2)}}else{ctx.fillStyle='#000820';ctx.fillRect(0,0,w,h)}ctx.fillStyle=boss?'#6b144f':'#102040';ctx.beginPath();ctx.moveTo(w*0.35,h*0.15);ctx.lineTo(w*0.65,h*0.15);ctx.lineTo(w*0.9,h);ctx.lineTo(w*0.1,h);ctx.closePath();ctx.fill();if(boss){drawEggBoss()}ctx.strokeStyle=boss?'#ffd85a':'#fff';ctx.lineWidth=2;for(let y=h*0.18;y<h;y+=40){let t=(y-h*0.15)/(h*0.85);let x1=w*0.5-4-8*t;let x2=w*0.5+4+8*t;let yy=y+(performance.now()/30%40);ctx.beginPath();ctx.moveTo(x1,yy);ctx.lineTo(x2,yy);ctx.stroke()}ctx.restore()}{let w=canvas.width;let h=canvas.height;ctx.save();if(shake>0){ctx.translate((Math.random()*6-3),(Math.random()*6-3))}ctx.fillStyle='#102040';ctx.beginPath();ctx.moveTo(w*0.35,h*0.15);ctx.lineTo(w*0.65,h*0.15);ctx.lineTo(w*0.9,h);ctx.lineTo(w*0.1,h);ctx.closePath();ctx.fill();if(boss){drawEggBoss()}ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let y=h*0.18;y<h;y+=40){let t=(y-h*0.15)/(h*0.85);let x1=w*0.5-4-8*t;let x2=w*0.5+4+8*t;let yy=y+(performance.now()/30%40);ctx.beginPath();ctx.moveTo(x1,yy);ctx.lineTo(x2,yy);ctx.stroke()}ctx.restore()}
function drawPair(o){let t=Math.max(0,Math.min(1,(o.y)/(canvas.height)));let s=0.8+t*0.7;ctx.fillStyle='#2b3d7a';let w=160*s;let h=40*s;let xL=laneXAtY(o.y,0);let xR=laneXAtY(o.y,1);ctx.fillRect(xL-w/2,o.y-h/2,w,h);ctx.fillRect(xR-w/2,o.y-h/2,w,h);ctx.fillStyle='#fff';ctx.font=(Math.max(14,16*s)|0)+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.left,xL,o.y);ctx.fillText(o.right,xR,o.y)}
function drawObstacle(o){let y=o.y;let x=laneXAtY(y,o.lane);let t=Math.max(0,Math.min(1,y/canvas.height));let s=0.7+t*0.8;if(o.kind==='barrier'){ctx.fillStyle='#7a2b2b';ctx.fillRect(x-36*s,y-18*s,72*s,36*s)}else{ctx.fillStyle='#0b0b0b';ctx.beginPath();ctx.ellipse(x,y,70*s,18*s,0,0,Math.PI*2);ctx.fill()}}
const pal={bolt:{a:'#2088ff',b:'#8cc8ff',d:'#0a2a66'},skye:{a:'#ff8a2e',b:'#ffd0a8',d:'#b85700'},brick:{a:'#e43131',b:'#ff9aa0',d:'#8f1111'},shade:{a:'#101015',b:'#303040',d:'#000'}};
function drawHero(x,y,skin,phase){const p=pal[skin]||pal.bolt;ctx.save();if(hurt>0)ctx.rotate(0.01*(hurt%4<2?1:-1));ctx.translate(x,y-(jump>0?10:0));ctx.fillStyle=p.a;ctx.beginPath();ctx.arc(0,-24,16,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.d;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-14+i*10,-26);ctx.lineTo(-4+i*10,-40);ctx.lineTo(-6+i*10,-12);ctx.closePath();ctx.fill()}if(skin==='skye'){ctx.fillStyle=p.a;ctx.beginPath();ctx.moveTo(-10,-30);ctx.lineTo(-4,-42);ctx.lineTo(2,-30);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(6,-30);ctx.lineTo(12,-42);ctx.lineTo(18,-30);ctx.closePath();ctx.fill();let tSwing=Math.sin(tick/8)*8;ctx.beginPath();ctx.moveTo(-12+tSwing,-8);ctx.quadraticCurveTo(-34,6,-6,16);ctx.quadraticCurveTo(-10,0,-12+tSwing,-8);ctx.fill();ctx.beginPath();ctx.moveTo(12+tSwing/2,-8);ctx.quadraticCurveTo(34,6,6,16);ctx.quadraticCurveTo(10,0,12+tSwing/2,-8);ctx.fill()}ctx.fillStyle=p.b;ctx.fillRect(-20,-16,40,26);ctx.fillStyle='#222';if(phase===0){ctx.fillRect(-20,2,16,8);ctx.fillRect(4,2,16,8)}else{ctx.fillRect(-18,0,16,8);ctx.fillRect(2,0,16,8)}ctx.restore();if(flash>0){ctx.fillStyle='rgba(255,80,80,0.35)';ctx.fillRect(x-26,y-46,52,52)}}
function drawPlayer(){let x=laneXAtY(baseY,playerLane);let y=baseY;drawHero(x,y,heroSkin,((tick/6)|0)%2)}
function emitParticles(x,y,color,count){for(let i=0;i<count;i++){particles.push({x,y,dx:(Math.random()*2-1)*2,dy:(Math.random()*-2-0.5),life:24,col:color})}}
function emitRingFX(x,y,count){for(let i=0;i<count;i++){ringFX.push({x,y,r:6+Math.random()*6,a:Math.random()*Math.PI*2,da:0.3+Math.random()*0.3,life:24})}}
function drawParticles(){let next=[],nextR=[];for(const p of particles){ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3);p.x+=p.dx;p.y+=p.dy;p.dy+=0.15;p.life--;if(p.life>0)next.push(p)}for(const r of ringFX){ctx.strokeStyle='#f4d35e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,r.a,r.a+Math.PI*1.2);ctx.stroke();r.a+=r.da;r.life--;r.r+=0.2;if(r.life>0)nextR.push(r)}particles=next;ringFX=nextR}
function drawHUD(){ctx.fillStyle='#ffd85a';ctx.font='18px monospace';ctx.textAlign='left';ctx.fillText('Rings: '+rings,10,22);if(boss){ctx.fillText('Boss',10,42)}}
function checkEnd(){if(!boss&&pool.length===0&&active.length===0){startBoss();nextPairIn=8;return}if(boss&&bossClears>=bossGoal&&active.length===0){playing=false;showBanner();return}}
function showBanner(){updateHighscores();let b=document.getElementById('banner');document.getElementById('finalStats').textContent='Rings: '+rings;document.getElementById('finalHigh').textContent='High Scores: '+highscores.join(', ');b.style.display='block';document.getElementById('wordList').classList.remove('hidden');try{document.getElementById('bgm').pause()}catch(e){}}
function updateHighscores(){highscores.push(rings);highscores.sort((a,b)=>b-a);highscores=highscores.slice(0,3)}
function setLane(dir){playerLane=Math.max(0,Math.min(lanes-1,playerLane+dir))}
let touchStartX=0,touchStartY=0,touching=false;
window.addEventListener('touchstart',e=>{if(!e.touches||!e.touches[0])return;touching=true;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY});
window.addEventListener('touchend',e=>{if(!touching)return;touching=false;let x=e.changedTouches[0].clientX;let y=e.changedTouches[0].clientY;let dx=x-touchStartX;let dy=Math.abs(y-touchStartY);if(Math.abs(dx)>30 && dy<120){if(dx<0)setLane(-1);else setLane(1)}});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')setLane(-1);if(e.key==='ArrowRight')setLane(1)});
document.getElementById('startBtn').addEventListener('click',()=>{layout();startGame()});
document.getElementById('heroSel').addEventListener('change',e=>{heroSkin=e.target.value});
(function(){const block=e=>{e.preventDefault()};['touchstart','touchmove','touchend'].forEach(ev=>{canvas.addEventListener(ev,block,{passive:false})});let lastT=0;window.addEventListener('touchend',e=>{const now=Date.now();if(now-lastT<350){e.preventDefault()}lastT=now},{passive:false});['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));})();
function drawEggBoss(){let w=canvas.width;let y=canvas.height*0.12;let x=w*0.5;ctx.save();ctx.translate(x,y);ctx.fillStyle='#6c6c6c';ctx.beginPath();ctx.ellipse(0,0,46,26,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2a2a2a';ctx.fillRect(-36,-10,72,20);ctx.fillStyle='#e33';ctx.fillRect(-12,-6,12,6);ctx.fillRect(2,-6,12,6);let arm=Math.sin(tick/10)*6;ctx.fillStyle='#888';ctx.fillRect(26,-2+arm,18,4);ctx.restore()}
</script>
</body>
</html>
